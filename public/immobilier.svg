<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 887" width="1774" height="887">
  <defs>
    <radialGradient id="bg" cx="60%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1f1a10"/>
      <stop offset="0.5" stop-color="#0b0a0c"/>
      <stop offset="1" stop-color="#040406"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8b04a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e8b04a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c47a1e"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1f"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b04a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8b04a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1774" height="887" fill="url(#bg)"/>

  <!-- Collines au loin -->
  <path d="M0 600 C300 520 520 560 760 530 C1000 500 1250 540 1500 510 C1640 495 1720 520 1774 515 V887 H0 Z" fill="#0a0a0d"/>

  <circle cx="1120" cy="430" r="460" fill="url(#glow)"/>

  <!-- Maison contemporaine -->
  <g>
    <!-- Étage -->
    <polygon points="900,250 1360,250 1440,210 980,210" fill="#3a3a42"/>
    <rect x="900" y="250" width="460" height="170" fill="url(#front)"/>
    <polygon points="1360,250 1440,210 1440,380 1360,420" fill="url(#side)"/>
    <!-- Rez-de-chaussée -->
    <polygon points="780,420 1360,420 1440,380 860,380" fill="#2e2e35"/>
    <rect x="780" y="420" width="580" height="200" fill="url(#front)"/>
    <polygon points="1360,420 1440,380 1440,580 1360,620" fill="url(#side)"/>

    <!-- Halos des fenêtres -->
    <g filter="url(#bloom)" opacity="0.8">
      <rect x="930" y="280" width="250" height="110" fill="#ffb84a"/>
      <rect x="810" y="450" width="360" height="150" fill="#ffb84a"/>
    </g>
    <!-- Fenêtres -->
    <rect x="930" y="280" width="250" height="110" fill="url(#win)"/>
    <path d="M1013 280 V390 M1097 280 V390" stroke="#1a1a1f" stroke-width="5"/>
    <rect x="1210" y="280" width="120" height="110" fill="#1b1b22" stroke="#ffd98a" stroke-opacity="0.25"/>
    <rect x="810" y="450" width="360" height="150" fill="url(#win)"/>
    <path d="M900 450 V600 M990 450 V600 M1080 450 V600" stroke="#1a1a1f" stroke-width="5"/>
    <rect x="1200" y="470" width="80" height="150" fill="#16161c" stroke="#ffd98a" stroke-opacity="0.3"/>
    <circle cx="1268" cy="548" r="4" fill="#ffd98a"/>

    <!-- Arbre -->
    <rect x="1500" y="470" width="8" height="150" fill="#1a1a1f"/>
    <ellipse cx="1504" cy="440" rx="55" ry="90" fill="#121216"/>
  </g>

  <!-- Bassin / reflet -->
  <rect x="700" y="625" width="860" height="10" fill="#e8b04a" opacity="0.6" filter="url(#soft)"/>
  <ellipse cx="1110" cy="660" rx="460" ry="50" fill="url(#water)" filter="url(#bloom)"/>
  <rect x="820" y="645" width="340" height="70" fill="#ffb84a" opacity="0.18" filter="url(#bloom)"/>

  <!-- Panneau : fiche bien -->
  <g transform="translate(130 130) rotate(-4)">
    <rect width="440" height="360" rx="24" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="24" y="24" width="392" height="180" rx="14" fill="#1a160f"/>
    <rect x="24" y="24" width="392" height="180" rx="14" fill="url(#glow)" opacity="0.6"/>
    <polygon points="160,150 220,100 280,150" fill="none" stroke="#ffd98a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="175" y="150" width="90" height="40" fill="none" stroke="#ffd98a" stroke-width="5"/>
    <text x="30" y="255" font-family="Arial, sans-serif" font-weight="700" font-size="34" fill="#ffd98a">485 000 €</text>
    <rect x="30" y="280" width="220" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <g fill="#ffffff" opacity="0.35">
      <rect x="30" y="312" width="70" height="22" rx="11"/>
      <rect x="112" y="312" width="70" height="22" rx="11"/>
      <rect x="194" y="312" width="90" height="22" rx="11"/>
    </g>
  </g>

  <!-- Panneau : carte -->
  <g transform="translate(220 540) rotate(-4)">
    <rect width="380" height="220" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" fill="none">
      <path d="M20 70 C120 90 200 40 360 80 M20 150 C140 130 240 180 360 140 M110 20 V200 M260 20 C240 100 280 140 250 200"/>
    </g>
    <path d="M190 70 C160 70 145 92 145 112 C145 145 190 175 190 175 C190 175 235 145 235 112 C235 92 220 70 190 70 Z" fill="#e8b04a"/>
    <circle cx="190" cy="112" r="14" fill="#1a160f"/>
  </g>

  <!-- Panneau partiel à droite -->
  <g transform="translate(1560 90) rotate(4)" opacity="0.6">
    <rect width="300" height="200" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="24" y="30" width="140" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="24" y="70" width="200" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="24" y="100" width="170" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="24" y="140" width="110" height="34" rx="17" fill="#e8b04a" opacity="0.8"/>
  </g>
</svg>
