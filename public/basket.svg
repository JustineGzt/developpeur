<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 887" width="1774" height="887">
  <defs>
    <radialGradient id="bg" cx="62%" cy="45%" r="75%">
      <stop offset="0" stop-color="#16200a"/>
      <stop offset="0.5" stop-color="#0a0b0c"/>
      <stop offset="1" stop-color="#040406"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b6ff3b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#b6ff3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d44"/>
      <stop offset="1" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26282e"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="midsole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f0"/>
      <stop offset="1" stop-color="#b9bbb4"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ff6b"/>
      <stop offset="1" stop-color="#7fd61a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ff6b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1774" height="887" fill="url(#bg)"/>

  <!-- Socle -->
  <ellipse cx="1110" cy="700" rx="420" ry="60" fill="#0f120c" stroke="#b6ff3b" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="1110" cy="700" rx="420" ry="60" fill="none" stroke="#b6ff3b" stroke-width="6" opacity="0.5" filter="url(#bloom)"/>

  <circle cx="1110" cy="420" r="430" fill="url(#glow)"/>

  <!-- Ombre -->
  <ellipse cx="1120" cy="690" rx="300" ry="22" fill="#000" opacity="0.7" filter="url(#soft)"/>

  <!-- Chaussure (profil, pointe à gauche) -->
  <g transform="translate(760 270) rotate(-10 350 200)">
    <!-- Semelle extérieure -->
    <path d="M28 300 C10 300 2 280 12 266 L690 262 C700 285 690 312 660 314 Z" fill="url(#lime)"/>
    <!-- Semelle intermédiaire -->
    <path d="M30 262 C8 262 2 238 22 224 C200 228 450 222 690 200 C702 225 700 250 690 262 Z" fill="url(#midsole)"/>
    <path d="M120 248 C300 246 480 238 640 226" stroke="#9a9c95" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- Tige -->
    <path d="M22 224 C18 185 60 165 140 156 C220 146 262 128 300 92 L352 46 C372 28 410 22 440 36 L470 62 C520 50 590 38 628 52 C668 70 692 120 692 170 L690 200 C450 222 200 228 22 224 Z" fill="url(#upper)"/>
    <!-- Embout -->
    <path d="M22 224 C18 185 60 165 140 156 C150 180 150 205 140 226 Z" fill="url(#panel)"/>
    <!-- Bande latérale -->
    <path d="M200 214 C300 170 430 120 600 90 C560 130 470 180 260 220 Z" fill="url(#lime)"/>
    <!-- Contrefort talon -->
    <path d="M600 60 C660 70 692 120 692 170 L690 200 C650 204 620 206 590 208 C610 160 615 110 600 60 Z" fill="url(#panel)"/>
    <rect x="650" y="40" width="22" height="60" rx="6" fill="url(#lime)" transform="rotate(20 661 70)"/>
    <!-- Coutures -->
    <path d="M40 210 C70 186 110 176 150 172" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <!-- Lacets -->
    <g stroke="#e9eae4" stroke-width="7" stroke-linecap="round">
      <path d="M290 110 L322 128"/>
      <path d="M312 90 L344 108"/>
      <path d="M334 70 L366 88"/>
      <path d="M356 52 L388 70"/>
    </g>
    <g fill="#0c0d0f">
      <circle cx="324" cy="130" r="5"/><circle cx="346" cy="110" r="5"/><circle cx="368" cy="90" r="5"/><circle cx="390" cy="72" r="5"/>
    </g>
    <!-- Languette -->
    <path d="M352 46 C372 20 412 10 446 24 L470 62 C440 50 400 50 380 70 Z" fill="#2c2f36"/>
    <!-- Reflet -->
    <path d="M80 175 C160 160 240 140 290 100" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Panneau : fiche produit -->
  <g transform="translate(130 140) rotate(-4)">
    <rect width="440" height="300" rx="24" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="30" y="34" width="160" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
    <rect x="30" y="60" width="110" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <text x="30" y="128" font-family="Arial, sans-serif" font-weight="700" font-size="40" fill="#d4ff6b">129 €</text>
    <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <g transform="translate(30 160)">
        <rect width="70" height="44" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.3"/><text x="35" y="28" fill="#ffffff" opacity="0.7">39</text>
      </g>
      <g transform="translate(112 160)">
        <rect width="70" height="44" rx="12" fill="#b6ff3b"/><text x="35" y="28" fill="#0c0d0f">40</text>
      </g>
      <g transform="translate(194 160)">
        <rect width="70" height="44" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.3"/><text x="35" y="28" fill="#ffffff" opacity="0.7">41</text>
      </g>
      <g transform="translate(276 160)">
        <rect width="70" height="44" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.3"/><text x="35" y="28" fill="#ffffff" opacity="0.7">42</text>
      </g>
    </g>
    <rect x="30" y="228" width="380" height="46" rx="23" fill="#ffffff" opacity="0.9"/>
    <rect x="150" y="247" width="140" height="8" rx="4" fill="#0c0d0f" opacity="0.7"/>
  </g>

  <!-- Panneau : coloris -->
  <g transform="translate(210 500) rotate(-4)">
    <rect width="360" height="170" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="28" y="30" width="120" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <circle cx="62" cy="105" r="30" fill="#b6ff3b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="142" cy="105" r="30" fill="#e9eae4"/>
    <circle cx="222" cy="105" r="30" fill="#2c2f36" stroke="#ffffff" stroke-opacity="0.3"/>
    <circle cx="302" cy="105" r="30" fill="#ff5a36"/>
  </g>

  <!-- Panneau partiel à droite -->
  <g transform="translate(1570 100) rotate(4)" opacity="0.6">
    <rect width="300" height="200" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="24" y="24" width="110" height="80" rx="12" fill="#ffffff" opacity="0.08"/>
    <rect x="150" y="34" width="110" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="150" y="60" width="80" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="24" y="130" width="120" height="36" rx="18" fill="#b6ff3b" opacity="0.8"/>
  </g>
</svg>
